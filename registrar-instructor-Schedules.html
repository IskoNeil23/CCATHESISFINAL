<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instructor View</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
    }

    .sidebar {
        height: 100%;
        width: 250px;
        position: fixed;
        z-index: 1;
        top: 0;
        left: 0;
        background-color: darkgreen;
        overflow-x: hidden;
        padding-top: 60px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .sidebar a {
        padding: 10px 15px;
        text-decoration: none;
        color: white;
        display: block;
        transition: 0.3s;
    }

    .sidebar a:hover {
        background-color: wheat;
        color: black;
    }

    .sidebar a.active {
        background-color: wheat; 
        color: rgb(0, 0, 0);
        font-weight: bold;
    }

    .sidebar img.navlog {
        display: block;
        width: 100px;
        margin: 0 auto 20px;
    }

    .sidebar h1 {
        color: white;
        text-align: center;
        font-size: 18px;
        margin-bottom: 30px;
        padding: 0 15px;
    }

    .topnav {
        background-color: white;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        top: 0;
        width: calc(100% - 250px);
        margin-left: 250px;
        z-index: 2;
    }

    .nav-left {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .logout-btn {
        background-color: #f44336;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }

    #main {
        margin-left: 250px;
        padding-top: 70px;
        padding: 80px 20px 20px;
    }

    .container {
        display: flex;
        gap: 20px;
    }

    .instructor-list {
        flex: 1;
        background-color: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        max-width: 300px;
        height: calc(100vh - 120px);
        overflow-y: auto;
    }

    .detail-panel {
        flex: 3;
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        height: calc(100vh - 120px);
        overflow-y: auto;
    }

    .instructor-card {
        background-color: #f9f9f9;
        padding: 10px 15px;
        border-radius: 5px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .instructor-card:hover {
        background-color: #f0f0f0;
        transform: translateY(-2px);
    }

    .instructor-card.active {
        background-color: #e3f2fd;
        border-left: 4px solid #2196F3;
    }

    .instructor-name {
        font-weight: bold;
        margin-bottom: 3px;
    }

    .instructor-id {
        color: #666;
        font-size: 14px;
    }

    .search-bar {
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        margin-bottom: 15px;
        width: 100%;
        box-sizing: border-box;
    }

    .tabs {
        display: flex;
        border-bottom: 1px solid #ddd;
        margin-bottom: 20px;
    }

    .tab {
        padding: 10px 20px;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        font-weight: bold;
    }

    .tab.active {
        border-bottom: 3px solid #4CAF50;
        color: #4CAF50;
    }

    .tab-content {
        display: none;
    }

    .tab-content.active {
        display: block;
    }

    .schedule-card {
        background-color: #f9f9f9;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 15px;
        border-left: 5px solid #4CAF50;
    }

    .schedule-card.lab {
        border-left-color: #2196F3;
    }

    .schedule-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
    }

    .subject-title {
        font-weight: bold;
        font-size: 16px;
        margin: 0;
    }

    .schedule-time {
        background-color: #e3f2fd;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 14px;
    }

    .schedule-details {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 10px;
    }

    .detail-item {
        flex: 1 0 200px;
    }

    .detail-label {
        font-size: 12px;
        color: #666;
        margin-bottom: 3px;
    }

    .detail-value {
        font-weight: bold;
    }

    .student-list {
        margin-top: 15px;
    }

    .student-list-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }

    .view-all-btn {
        background-color: #4CAF50;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
    }

    .student-table {
        width: 100%;
        border-collapse: collapse;
    }

    .student-table th, .student-table td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
    }

    .student-table th {
        background-color: #f2f2f2;
    }

    .student-table tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    .student-table tr:hover {
        background-color: #f1f1f1;
    }

    .student-modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
        background-color: white;
        margin: 5% auto;
        padding: 20px;
        border-radius: 8px;
        width: 80%;
        max-width: 900px;
        max-height: 80vh;
        overflow-y: auto;
    }

    .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }

    .close:hover {
        color: black;
    }

    .instructor-profile {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
    }

    .profile-image {
        width: 150px;
        height: 150px;
        background-color: #ddd;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 64px;
        color: #999;
    }

    .profile-info {
        flex: 1;
    }

    .profile-name {
        font-size: 24px;
        margin: 0 0 10px;
    }

    .profile-detail {
        display: flex;
        gap: 20px;
        margin-bottom: 5px;
    }

    .profile-label {
        font-weight: bold;
        width: 120px;
    }

    .profile-value {
        flex: 1;
    }

    .small-stats {
        display: flex;
        gap: 15px;
        margin-top: 15px;
    }

    .stat-box {
        background-color: #f9f9f9;
        padding: 15px;
        border-radius: 8px;
        flex: 1;
        text-align: center;
    }

    .stat-number {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 5px;
        color: #4CAF50;
    }

    .stat-label {
        color: #666;
    }

    .no-schedules {
        text-align: center;
        padding: 40px 0;
        color: #666;
    }

    .no-schedules i {
        font-size: 48px;
        margin-bottom: 15px;
        display: block;
    }

    .schedule-actions {
        margin-top: 10px;
        display: flex;
        gap: 10px;
        justify-content: flex-end;
    }

    .action-btn {
        padding: 5px 10px;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        font-size: 14px;
    }

    .view-btn {
        background-color: #4CAF50;
        color: white;
    }

    .print-btn {
        background-color: #2196F3;
        color: white;
    }

    @media screen and (max-width: 768px) {
        .sidebar {
            width: 0;
            padding-top: 20px;
        }
        
        .topnav, #main {
            margin-left: 0;
            width: 100%;
        }
        
        .container {
            flex-direction: column;
        }
        
        .instructor-list {
            max-width: 100%;
            height: auto;
            max-height: 300px;
        }
        
        .detail-panel {
            height: auto;
        }
    }
</style>
</head>
<body>

<div id="mySidebar" class="sidebar">
    <img class="navlog" src="cca-logo.png" alt="">
    <h1>City College of Angeles City</h1>  
    <a href="RegistrarEnrolledStudents.html">Enrolled Students</a>
    <a href="RegistrarClassRecords.html">Class Records</a>
    <a href="RegistrarInstructorManagement.html">Instructors Management</a>
    <a href="RegistrarInstructSchedules.html">Instructor Schedules</a>
    <a class="active">Instructor View</a>
</div>

<!-- Top navigation bar with logout button -->
<div id="topNav" class="topnav">
    <div class="nav-left">
        <img src="cca-logo.png" alt="CCA Logo" height="50">
        <h3>City College of Angeles City - Instructor View</h3>
    </div>
    <button class="logout-btn" onclick="logout()">Log Out</button>
</div>

<div id="main">
    <div class="container">
        <!-- Instructor List Panel -->
        <div class="instructor-list">
            <input type="text" class="search-bar" id="instructorSearch" placeholder="Search instructors...">
            <div id="instructorCards">
                <!-- Instructor cards will be dynamically populated here -->
            </div>
        </div>
        
        <!-- Details Panel -->
        <div class="detail-panel">
            <div id="instructorDetail">
                <!-- Instructor details, schedules, and students will be shown here -->
                <div class="no-instructor-selected" style="text-align: center; padding: 40px 0; color: #666;">
                    <i style="font-size: 48px; margin-bottom: 15px; display: block;">👨‍🏫</i>
                    <h3>No instructor selected</h3>
                    <p>Select an instructor from the list to view their details and schedules.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Student List Modal -->
<div id="studentModal" class="student-modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle">Student List</h2>
        <div id="modalContent">
            <!-- Student list will be dynamically populated here -->
        </div>
    </div>
</div>

<script>
// Mock data structure (in a real system, this would come from localStorage or an API)
const instructors = JSON.parse(localStorage.getItem('instructors')) || [];
const schedules = JSON.parse(localStorage.getItem('instructorSchedules')) || [];
const students = JSON.parse(localStorage.getItem('enrolledStudents')) || [];

// Function to get formatted name
function getFormattedName(instructor) {
    return `${instructor.lastName}, ${instructor.firstName} ${instructor.middleName || ''}`.trim();
}

// Function to populate instructor list
function populateInstructorList() {
    const instructorCards = document.getElementById('instructorCards');
    const searchTerm = document.getElementById('instructorSearch').value.toLowerCase();
    
    // Clear current list
    instructorCards.innerHTML = '';
    
    // Sort instructors by last name
    const sortedInstructors = [...instructors].sort((a, b) => a.lastName.localeCompare(b.lastName));
    
    // Filter instructors based on search term
    const filteredInstructors = sortedInstructors.filter(instructor => {
        const fullName = getFormattedName(instructor).toLowerCase();
        const id = instructor.instructorId.toLowerCase();
        return fullName.includes(searchTerm) || id.includes(searchTerm);
    });
    
    // Create instructor cards
    filteredInstructors.forEach(instructor => {
        const card = document.createElement('div');
        card.className = 'instructor-card';
        card.dataset.id = instructor.instructorId;
        
        // Get instructor schedules count
        const instructorSchedules = schedules.filter(s => s.instructorId === instructor.instructorId);
        
        card.innerHTML = `
            <div class="instructor-name">${instructor.lastName}, ${instructor.firstName}</div>
            <div class="instructor-id">${instructor.instructorId} (${instructorSchedules.length} classes)</div>
        `;
        
        card.addEventListener('click', () => {
            // Remove active class from all cards
            document.querySelectorAll('.instructor-card').forEach(c => c.classList.remove('active'));
            
            // Add active class to selected card
            card.classList.add('active');
            
            // Show instructor details
            showInstructorDetail(instructor.instructorId);
        });
        
        instructorCards.appendChild(card);
    });
    
    // Show message if no instructors found
    if (filteredInstructors.length === 0) {
        instructorCards.innerHTML = '<div style="text-align: center; padding: 20px;">No instructors found</div>';
    }
}

// Function to show instructor details
function showInstructorDetail(instructorId) {
    const instructor = instructors.find(i => i.instructorId === instructorId);
    const instructorDetail = document.getElementById('instructorDetail');
    
    if (!instructor) {
        instructorDetail.innerHTML = '<div>Instructor not found</div>';
        return;
    }
    
    // Get instructor schedules
    const instructorSchedules = schedules.filter(s => s.instructorId === instructorId);
    
    // Calculate total students
    let totalStudents = 0;
    const uniqueStudents = new Set();
    const uniqueSections = new Set();
    
    instructorSchedules.forEach(schedule => {
        // Count unique sections
        uniqueSections.add(`${schedule.institute}-${schedule.yearLevel}-${schedule.section}`);
        
        // Count students in each section
        const sectionStudents = students.filter(student => 
            student.institute === schedule.institute &&
            student.yearLevel === schedule.yearLevel &&
            student.section === schedule.section
        );
        
        totalStudents += sectionStudents.length;
        
        // Add unique students to set
        sectionStudents.forEach(student => uniqueStudents.add(student.studentId));
    });
    
    // Create instructor profile HTML
    let detailHTML = `
        <div class="instructor-profile">
            <div class="profile-image">${instructor.firstName.charAt(0)}${instructor.lastName.charAt(0)}</div>
            <div class="profile-info">
                <h2 class="profile-name">${getFormattedName(instructor)}</h2>
                
                <div class="profile-detail">
                    <div class="profile-label">Instructor ID:</div>
                    <div class="profile-value">${instructor.instructorId}</div>
                </div>
                
                <div class="profile-detail">
                    <div class="profile-label">Email:</div>
                    <div class="profile-value">${instructor.email || 'Not provided'}</div>
                </div>
                
                <div class="profile-detail">
                    <div class="profile-label">Contact:</div>
                    <div class="profile-value">${instructor.contactNumber || 'Not provided'}</div>
                </div>
                
                <div class="profile-detail">
                    <div class="profile-label">Department:</div>
                    <div class="profile-value">${instructor.department || 'Not assigned'}</div>
                </div>
                
                <div class="small-stats">
                    <div class="stat-box">
                        <div class="stat-number">${instructorSchedules.length}</div>
                        <div class="stat-label">Classes</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number">${uniqueSections.size}</div>
                        <div class="stat-label">Sections</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number">${uniqueStudents.size}</div>
                        <div class="stat-label">Students</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" data-tab="schedules">Schedules</div>
            <div class="tab" data-tab="classes">Class Sections</div>
        </div>
        
        <!-- Schedules Tab -->
        <div id="schedulesTab" class="tab-content active">
            <h3>Teaching Schedules</h3>
    `;
    
    // Add schedules or show no schedules message
    if (instructorSchedules.length === 0) {
        detailHTML += `
            <div class="no-schedules">
                <i>📅</i>
                <h3>No schedules found</h3>
                <p>This instructor doesn't have any assigned classes yet.</p>
            </div>
        `;
    } else {
        // Sort schedules by day and time
        const sortedSchedules = [...instructorSchedules].sort((a, b) => {
            const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
            const dayOrder = days.indexOf(a.day) - days.indexOf(b.day);
            if (dayOrder !== 0) return dayOrder;
            
            const aStart = new Date(`2000-01-01T${a.startTime}`);
            const bStart = new Date(`2000-01-01T${b.startTime}`);
            return aStart - bStart;
        });
        
        // Add each schedule
        sortedSchedules.forEach(schedule => {
            // Format time for display
            const startTime = new Date(`2000-01-01T${schedule.startTime}`).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const endTime = new Date(`2000-01-01T${schedule.endTime}`).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            // Count students in this section
            const sectionStudents = students.filter(student => 
                student.institute === schedule.institute &&
                student.yearLevel === schedule.yearLevel &&
                student.section === schedule.section
            );
            
            detailHTML += `
                <div class="schedule-card ${schedule.roomType === 'Laboratory' ? 'lab' : ''}">
                    <div class="schedule-header">
                        <h4 class="subject-title">${schedule.subjectCode}: ${schedule.subject}</h4>
                        <div class="schedule-time">${schedule.day}, ${startTime} - ${endTime}</div>
                    </div>
                    
                    <div class="schedule-details">
                        <div class="detail-item">
                            <div class="detail-label">Section</div>
                            <div class="detail-value">${schedule.yearLevel}-${schedule.section}</div>
                        </div>
                        
                        <div class="detail-item">
                            <div class="detail-label">Room</div>
                            <div class="detail-value">${schedule.roomNumber} (${schedule.roomType})</div>
                        </div>
                        
                        <div class="detail-item">
                            <div class="detail-label">Institute</div>
                            <div class="detail-value">${schedule.institute}</div>
                        </div>
                        
                        <div class="detail-item">
                            <div class="detail-label">Students</div>
                            <div class="detail-value">${sectionStudents.length} enrolled</div>
                        </div>
                    </div>
                    
                    <div class="student-list">
                        <div class="student-list-header">
                            <h5>Enrolled Students</h5>
                            <button class="view-all-btn" onclick="viewAllStudents('${schedule.institute}', '${schedule.yearLevel}', '${schedule.section}', '${schedule.subject}')">View All</button>
                        </div>
                        
                        <table class="student-table">
                            <thead>
                                <tr>
                                    <th>Student ID</th>
                                    <th>Student Name</th>
                                    <th>Gender</th>
                                </tr>
                            </thead>
                            <tbody>
            `;
            
            // Add up to 5 students for preview
            const previewStudents = sectionStudents.slice(0, 5);
            
            if (previewStudents.length === 0) {
                detailHTML += `<tr><td colspan="3">No students enrolled</td></tr>`;
            } else {
                previewStudents.forEach(student => {
                    detailHTML += `
                        <tr>
                            <td>${student.studentId}</td>
                            <td>${student.lastName}, ${student.firstName} ${student.middleName || ''}</td>
                            <td>${student.gender || 'N/A'}</td>
                        </tr>
                    `;
                });
                
                // Show how many more students there are
                if (sectionStudents.length > 5) {
                    detailHTML += `<tr><td colspan="3">+ ${sectionStudents.length - 5} more students</td></tr>`;
                }
            }
            
            detailHTML += `
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="schedule-actions">
                        <button class="action-btn print-btn" onclick="printSchedule('${schedule.id}')">Print Class List</button>
                    </div>
                </div>
            `;
        });
    }
    
    // Add Classes Tab
    detailHTML += `
        </div>
        
        <!-- Classes Tab -->
        <div id="classesTab" class="tab-content">
            <h3>Class Sections</h3>
    `;
    
    // Get unique sections taught by this instructor
    const uniqueSectionsList = Array.from(uniqueSections);
    
    if (uniqueSectionsList.length === 0) {
        detailHTML += `
            <div class="no-schedules">
                <i>👨‍👩‍👧‍👦</i>
                <h3>No class sections found</h3>
                <p>This instructor doesn't have any assigned classes yet.</p>
            </div>
        `;
    } else {
        // Display each unique section with student count
        uniqueSectionsList.forEach(sectionKey => {
            const [institute, yearLevel, section] = sectionKey.split('-');
            
            // Get courses for this section
            const sectionSchedules = instructorSchedules.filter(s => 
                s.institute === institute &&
                s.yearLevel === yearLevel &&
                s.section === section
            );
            
            // Get all students in this section
            const sectionStudents = students.filter(student => 
                student.institute === institute &&
                student.yearLevel === yearLevel &&
                student.section === section
            );
            
            // Get course name from the first schedule (should be the same for all)
            const courseName = sectionSchedules.length > 0 ? sectionSchedules[0].course : 'Unknown Course';
            
            detailHTML += `
                <div class="schedule-card">
                    <div class="schedule-header">
                        <h4 class="subject-title">${institute} ${yearLevel}-${section}</h4>
                        <div class="schedule-time">${sectionStudents.length} Students</div>
                    </div>
                    
                    <div class="schedule-details">
                        <div class="detail-item">
                            <div class="detail-label">Course</div>
                            <div class="detail-value">${courseName}</div>
                        </div>
                        
                        <div class="detail-item">
                            <div class="detail-label">Subjects Taught</div>
                            <div class="detail-value">${sectionSchedules.length} subjects</div>
                        </div>
                    </div>
                    
                    <div class="schedule-details">
                        <div class="detail-item">
                            <div class="detail-label">Subjects</div>
                            <div class="detail-value">
                                ${sectionSchedules.map(s => `${s.subjectCode}: ${s.subject}`).join('<br>')}
                            </div>
                        </div>
                    </div>
                    
                    <div class="schedule-actions">
                        <button class="action-btn view-btn" onclick="viewAllStudents('${institute}', '${yearLevel}', '${section}')">View All Students</button>
                        <button class="action-btn print-btn" onclick="printClassList('${institute}', '${yearLevel}', '${section}')">Print Class List</button>
                    </div>
                </div>
            `;
        });
    }
    
    detailHTML += `</div>`;
    
    // Set the HTML
    instructorDetail.innerHTML = detailHTML;
    
    // Add tab functionality
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            // Remove active class from all tabs and tab contents
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            // Add active class to clicked tab and corresponding content
            tab.classList.add('active');
            document.getElementById(`${tab.dataset.tab}Tab`).classList.add('active');
        });
    });
}

// Function to view all students in a section
function viewAllStudents(institute, yearLevel, section, subject = null) {
    // Get students in the section
    const sectionStudents = students.filter(student => 
        student.institute === institute &&
        student.yearLevel === yearLevel &&
        student.section === section
    );
    
    // Sort students by last name
    sectionStudents.sort((a, b) => a.lastName.localeCompare(b.lastName));
    
    // Set modal title
    const modalTitle = document.getElementById('modalTitle');
    if (subject) {
        modalTitle.textContent = `Students in ${institute} ${yearLevel}-${section} (${subject})`;
    } else {
        modalTitle.textContent = `Students in ${institute} ${yearLevel}-${section}`;
    }
    
    // Build table HTML
    let tableHTML = `
        <table class="student-table">
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>Email</th>
                    <th>Contact</th>
                </tr>
            </thead>
            <tbody>
    `;
    
    if (sectionStudents.length === 0) {
        tableHTML += `<tr><td colspan="5">No students enrolled in this section</td></tr>`;
    } else {
        sectionStudents.forEach(student => {
            tableHTML += `
                <tr>
                    <td>${student.studentId}</td>
                    <td>${student.lastName}, ${student.firstName} ${student.middleName || ''}</td>
                    <td>${student.gender || 'N/A'}</td>
                    <td>${student.email || 'N/A'}</td>
                    <td>${student.contactNumber || 'N/A'}</td>
                </tr>
            `;
        });
    }
    
    tableHTML += `
            </tbody>
        </table>
        <div style="margin-top: 15px;">
            <button class="action-btn print-btn" onclick="printStudentList('${institute}', '${yearLevel}', '${section}')">Print Student List</button>
        </div>
    `;
    
    // Set modal content
    document.getElementById('modalContent').innerHTML = tableHTML;
    
    // Show modal
    document.getElementById('studentModal').style.display = 'block';
}
