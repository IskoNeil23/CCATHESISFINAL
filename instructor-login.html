<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instructor Login - City College of Angeles City</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .login-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 400px;
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo {
            max-width: 120px;
            margin-bottom: 10px;
        }
        
        h1 {
            color: darkgreen;
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        input[type="email"], input[type="password"], input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        
        button {
            background-color: darkgreen;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #006400;
        }
        
        .error-message {
            color: #f44336;
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        
        .links {
            margin-top: 20px;
            text-align: center;
        }
        
        .links a {
            color: darkgreen;
            text-decoration: none;
            font-size: 14px;
        }
        
        .links a:hover {
            text-decoration: underline;
        }
        
        .show-password {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <img src="cca-logo.png" alt="CCA Logo" class="logo">
            <h1>City College of Angeles City</h1>
            <h2>Instructor Portal Login</h2>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <div class="show-password">
                    <input type="checkbox" id="showPassword"> <label for="showPassword">Show password</label>
                </div>
            </div>
            
            <button type="submit">Login</button>
            
            <div id="errorMessage" class="error-message">
                Invalid email or password. Please try again.
            </div>
            
            <div class="links">
                <a href="student-login.html">Student Login</a> | <a href="Registrar-Login.html">Administrative Login</a>
            </div>
        </form>
    </div>

    <script>
        // Toggle password visibility
        document.getElementById('showPassword').addEventListener('change', function() {
            const passwordField = document.getElementById('password');
            passwordField.type = this.checked ? 'text' : 'password';
        });
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Get accounts from localStorage
            const instructorAccounts = JSON.parse(localStorage.getItem('instructorAccounts')) || [];
            const instructors = JSON.parse(localStorage.getItem('instructors')) || [];
            
            // Find the account with matching email
            const account = instructorAccounts.find(acc => acc.email === email);
            
            if (account && account.password === password) {
                // Login successful
                
                // Find instructor details for personalized welcome
                const instructor = instructors.find(i => i.instructorId === account.instructorId);
                
                if (instructor) {
                    // Store logged in instructor info in session storage
                    sessionStorage.setItem('loggedInInstructor', JSON.stringify({
                        id: instructor.instructorId,
                        firstName: instructor.firstName,
                        lastName: instructor.lastName,
                        middleName: instructor.middleName,
                        email: instructor.emailAddress
                    }));
                    
                    // Redirect to instructor dashboard
                    window.location.href = 'instructor-dashboard.html';
                } else {
                    // Instructor details not found
                    showError('Instructor details not found. Please contact administrator.');
                }
            } else {
                // Login failed
                showError('Invalid email or password. Please try again.');
            }
        });
        
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            
            // Clear password field
            document.getElementById('password').value = '';
            
            // Focus on email
            document.getElementById('email').focus();
            
            // Hide error after 3 seconds
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
