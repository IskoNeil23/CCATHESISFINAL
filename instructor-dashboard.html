<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="instructor.css">
    <title>Class Schedule - City College of Angeles</title>
    <style>
        .main-content {
            margin-left: 240px;
            padding: 90px 30px 30px;
        }
        
        .schedules-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .schedule-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .schedule-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        
        .schedule-header {
            background-color: #006400;
            color: white;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .schedule-header h3 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 0.5px;
        }
        
        .schedule-id {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .schedule-info {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        
        .schedule-info h4 {
            color: #006400;
            margin: 0 0 8px 0;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .info-row {
            display: flex;
            margin-bottom: 5px;
        }
        
        .info-label {
            font-weight: bold;
            color: #444;
            min-width: 100px;
        }
        
        .info-value {
            color: #333;
        }
        
        .schedule-tables {
            display: flex;
            flex-direction: column;
            padding: 10px 15px;
        }
        
        .section-label {
            font-size: 14px;
            font-weight: bold;
            background-color: #006400;
            color: white;
            padding: 8px 10px;
            text-align: center;
            margin-bottom: 0;
            border-radius: 4px 4px 0 0;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 12px;
            font-size: 13px;
        }
        
        th, td {
            padding: 8px 6px;
            text-align: center;
            border: 1px solid #ddd;
        }
        
        th {
            background-color: #f2f2f2;
            color: #444;
            font-weight: bold;
        }
        
        .no-schedules {
            text-align: center;
            padding: 30px;
            background-color: #f9f9f9;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        
        .filter-group label {
            font-size: 13px;
            margin-bottom: 5px;
            color: #444;
            font-weight: bold;
        }
        
        .filter-group select {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
            min-width: 140px;
        }
        
        .course-section {
            font-style: italic;
            font-size: 13px;
            margin-top: 5px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .subject-code {
            font-weight: bold;
            font-size: 15px;
            color: #444;
            margin-top: 5px;
        }
        
        .units-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
            text-align: center;
        }
        
        .unit-item {
            background-color: #f5f5f5;
            padding: 8px 5px;
            border-radius: 5px;
        }
        
        .unit-value {
            font-size: 18px;
            font-weight: bold;
            color: #006400;
        }
        
        .unit-label {
            font-size: 11px;
            color: #666;
        }
        
        /* Custom color for different class types */
        .lecture-header {
            background-color: #006400;
        }
        
        .lab-header {
            background-color: #8B4513;
        }
        
        .lec-lab-header {
            background-color: #4B0082;
        }
        
        /* Class materials section */
        .class-materials {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            background-color: #f9f9f9;
            border-top: 1px solid #eee;
        }
        
        .material-button {
            background-color: #006400;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
            flex: 1;
            margin: 0 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .material-button:hover {
            background-color: #004d00;
        }
        
        .material-button i {
            margin-right: 5px;
        }
        
        /* Time slot highlighting */
        .time-slot {
            background-color: #f9f9f9;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
        }
        
        .time-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .day-time {
            font-size: 14px;
            color: #006400;
        }
        
        .room-info {
            font-size: 14px;
            color: #444;
        }
        
        @media (max-width: 768px) {
            .schedules-container {
                grid-template-columns: 1fr;
            }
            .main-content {
                margin-left: 0;
                padding: 80px 15px 15px;
            }
            .class-materials {
                flex-direction: column;
                gap: 10px;
            }
            .material-button {
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <img src="cca-logo.png" alt="CCA Logo">
        <h1>City College of Angeles</h1>
        <a class="active">Class Records</a>
        <a href="instructor-approval-letters.html">Approval Letters</a>
    </div>
    
    <div class="topnav">
        <div class="nav-left">
            <img src="cca-logo.png" alt="CCA Logo">
            <h3>Instructor Portal</h3>
        </div>
        <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>
    
    <div class="main-content">
        <h2>My Class Schedules</h2>
        
        <div class="filters">
            <div class="filter-group">
                <label for="filterSchoolYear">School Year:</label>
                <select id="filterSchoolYear" onchange="filterSchedules()">
                    <option value="">All School Years</option>
                    <option value="2024-2025">2024-2025</option>
                    <option value="2025-2026">2025-2026</option>
                    <option value="2026-2027">2026-2027</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="filterSemester">Semester:</label>
                <select id="filterSemester" onchange="filterSchedules()">
                    <option value="">All Semesters</option>
                    <option value="1st Semester">1st Semester</option>
                    <option value="2nd Semester">2nd Semester</option>
                    <option value="Summer">Summer</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="filterDay">Day:</label>
                <select id="filterDay" onchange="filterSchedules()">
                    <option value="">All Days</option>
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                </select>
            </div>
        </div>
        
        <div id="schedulesContainer" class="schedules-container">
            <!-- Schedule cards will be dynamically added here -->
        </div>
        
        <div id="noSchedulesMessage" class="no-schedules" style="display: none;">
            <h3>No class schedules found</h3>
            <p>No schedules have been assigned to you for the selected filters.</p>
        </div>
    </div>

    <script>
        // Global variable to store instructor details
        let instructorDetails = null;
        let allSchedules = [];
        
        // Function to check if instructor is logged in
        function checkLogin() {
            const loggedInInstructor = JSON.parse(sessionStorage.getItem('loggedInInstructor'));
            
            if (!loggedInInstructor) {
                // Not logged in, redirect to login page
                window.location.href = 'student-login.html';
                return;
            }
            
            // Get the email from the logged in instructor
            const instructorEmail = loggedInInstructor.email || loggedInInstructor.emailAddress;
            
            if (!instructorEmail) {
                console.error('No email found in logged in instructor data');
                return;
            }
            
            // Get all instructors from localStorage
            const allInstructors = JSON.parse(localStorage.getItem('instructors')) || [];
            
            // Find the instructor with matching email
            const fullInstructorInfo = allInstructors.find(instructor => 
                instructor.emailAddress.toLowerCase() === instructorEmail.toLowerCase()
            );
            
            if (fullInstructorInfo) {
                // Store instructor details globally
                instructorDetails = fullInstructorInfo;
                
                // Load schedules for this instructor
                loadInstructorSchedules(instructorEmail);
            } else {
                console.warn('Full instructor info not found for email:', instructorEmail);
                // Still try to load schedules using the email from session
                loadInstructorSchedules(instructorEmail);
            }
        }
        
        // Function to load schedules for the logged-in instructor
        function loadInstructorSchedules(instructorEmail) {
            // Get all schedules from localStorage
            const schedules = JSON.parse(localStorage.getItem('instructorSchedules')) || [];
            
            // Filter schedules for the current instructor
            allSchedules = schedules.filter(schedule => 
                schedule.instructorEmail.toLowerCase() === instructorEmail.toLowerCase()
            );
            
            // Add unique identifier to each schedule
            allSchedules.forEach((schedule, index) => {
                // Create a unique ID that combines all important schedule fields
                const uniqueId = `${schedule.subjectCode}_${schedule.dayOfWeek}_${schedule.startTime}_${schedule.schoolYear}_${schedule.semester}_${schedule.section}`;
                schedule.uniqueScheduleId = uniqueId;
            });
            
            // Display the schedules
            filterSchedules();
        }
        
        // Function to apply filters and display schedules
        function filterSchedules() {
            const schoolYearFilter = document.getElementById('filterSchoolYear').value;
            const semesterFilter = document.getElementById('filterSemester').value;
            const dayFilter = document.getElementById('filterDay').value;
            
            // Apply filters
            const filteredSchedules = allSchedules.filter(schedule => {
                return (
                    (!schoolYearFilter || schedule.schoolYear === schoolYearFilter) &&
                    (!semesterFilter || schedule.semester === semesterFilter) &&
                    (!dayFilter || schedule.dayOfWeek === dayFilter)
                );
            });
            
            // Sort schedules by school year, semester, day, time
            filteredSchedules.sort((a, b) => {
                if (a.schoolYear !== b.schoolYear) {
                    return a.schoolYear.localeCompare(b.schoolYear);
                }
                if (a.semester !== b.semester) {
                    return a.semester.localeCompare(b.semester);
                }
                if (a.section !== b.section) {
                    return a.section.localeCompare(b.section);
                }
                
                // Sort days of week in correct order
                const daysOrder = { 'Monday': 1, 'Tuesday': 2, 'Wednesday': 3, 'Thursday': 4, 'Friday': 5, 'Saturday': 6 };
                if (a.dayOfWeek !== b.dayOfWeek) {
                    return daysOrder[a.dayOfWeek] - daysOrder[b.dayOfWeek];
                }
                
                // Sort by start time
                return a.startTime.localeCompare(b.startTime);
            });
            
            // Display individual schedules
            displayIndividualSchedules(filteredSchedules);
        }
        
        // Function to display individual schedules
        function displayIndividualSchedules(schedules) {
            const container = document.getElementById('schedulesContainer');
            const noSchedulesMessage = document.getElementById('noSchedulesMessage');
            
            // Clear container
            container.innerHTML = '';
            
            if (schedules.length === 0) {
                noSchedulesMessage.style.display = 'block';
                return;
            }
            
            noSchedulesMessage.style.display = 'none';
            
            // Create a card for each individual schedule
            schedules.forEach((schedule, index) => {
                const card = document.createElement('div');
                card.className = 'schedule-card';
                card.setAttribute('data-schedule-id', schedule.uniqueScheduleId);
                
                // Determine header class based on class type
                let headerClass = 'lecture-header';
                if (schedule.classType === 'Laboratory') {
                    headerClass = 'lab-header';
                } else if (schedule.classType === 'Lecture/Laboratory') {
                    headerClass = 'lec-lab-header';
                }
                
                // Format year level (1 -> 1st, 2 -> 2nd, etc.)
                const formattedYearLevel = getFormattedYearLevel(schedule.yearLevel);
                
                // Create card content
                card.innerHTML = `
                    <div class="schedule-header ${headerClass}">
                        <h3>${formattedYearLevel} ${schedule.section}</h3>
                        <span class="schedule-id">${schedule.schoolYear} • ${schedule.semester}</span>
                    </div>
                    
                    <div class="schedule-info">
                        <h4 title="${schedule.subjectTitle}">${schedule.subjectTitle}</h4>
                        <div class="subject-code">${schedule.subjectCode} (${schedule.classType})</div>
                        <div class="course-section" title="${schedule.institute} • ${schedule.course}">
                            ${schedule.institute} • ${schedule.course}
                        </div>
                        
                        <div class="units-info">
                            <div class="unit-item">
                                <div class="unit-value">${schedule.classType === 'Laboratory' ? 0 : Math.ceil(schedule.units/2)}</div>
                                <div class="unit-label">Lec Hours</div>
                            </div>
                            <div class="unit-item">
                                <div class="unit-value">${schedule.classType === 'Lecture' ? 0 : Math.floor(schedule.units/2)}</div>
                                <div class="unit-label">Lab Hours</div>
                            </div>
                            <div class="unit-item">
                                <div class="unit-value">${schedule.units}</div>
                                <div class="unit-label">Units</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="time-slot">
                        <div class="time-info">
                            <span class="day-time">${schedule.dayOfWeek}, ${formatTime(schedule.startTime)} - ${formatTime(schedule.endTime)}</span>
                            <span class="room-info">Room: ${schedule.roomNumber || (schedule.classType === 'Lecture/Laboratory' ? `${schedule.lectureRoomNumber || 'N/A'} / ${schedule.labRoomNumber || 'N/A'}` : 'N/A')}</span>
                        </div>
                    </div>
                    
                    <div class="class-materials">
                        <button class="material-button" onclick="openAttendanceSheet('${schedule.uniqueScheduleId}')">
                            <i class="fas fa-clipboard-list"></i> Attendance
                        </button>
                        <button class="material-button" onclick="openSeatPlan('${schedule.uniqueScheduleId}')">
                            <i class="fas fa-th"></i> Seat Plan
                        </button>
                        <button class="material-button" onclick="openGradingSheet('${schedule.uniqueScheduleId}')">
                            <i class="fas fa-file-alt"></i> Grades
                        </button>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }
        
        // Function to format year level (1 -> 1st, 2 -> 2nd, etc.)
        function getFormattedYearLevel(yearLevel) {
            if (!yearLevel) return 'N/A';
            
            const yearNum = parseInt(yearLevel);
            if (isNaN(yearNum)) return yearLevel;
            
            if (yearNum === 1) return '1st';
            if (yearNum === 2) return '2nd';
            if (yearNum === 3) return '3rd';
            return yearNum + 'th';
        }
        
        // Format time from 24-hour to 12-hour format
        function formatTime(timeString) {
            if (!timeString) return 'N/A';
            try {
                const time = new Date(`2000-01-01T${timeString}`);
                return time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return timeString;
            }
        }
        
        // Functions to handle opening attendance sheet, seat plan and grading sheet
        function openAttendanceSheet(scheduleId) {
            // Find the schedule by the unique ID
            const scheduleData = allSchedules.find(schedule => schedule.uniqueScheduleId === scheduleId);
            
            if (!scheduleData) {
                console.error('Schedule not found for ID:', scheduleId);
                return;
            }
            
            // Store the selected schedule in session storage
            sessionStorage.setItem('selectedSchedule', JSON.stringify(scheduleData));
            window.location.href = `InstructorAttendancesheet.html`;
        }
        
        function openSeatPlan(scheduleId) {
            // Find the schedule by the unique ID
            const scheduleData = allSchedules.find(schedule => schedule.uniqueScheduleId === scheduleId);
            
            if (!scheduleData) {
                console.error('Schedule not found for ID:', scheduleId);
                return;
            }
            
            // Store the selected schedule in session storage
            sessionStorage.setItem('selectedSchedule', JSON.stringify(scheduleData));
            window.location.href = 'instructor-seat-plan.html';
        }
        
        function openGradingSheet(scheduleId) {
            // Find the schedule by the unique ID
            const scheduleData = allSchedules.find(schedule => schedule.uniqueScheduleId === scheduleId);
            
            if (!scheduleData) {
                console.error('Schedule not found for ID:', scheduleId);
                return;
            }
            
            // Store the selected schedule in session storage
            sessionStorage.setItem('selectedSchedule', JSON.stringify(scheduleData));
            window.location.href = 'instructor-grading-sheet.html';
        }
        
        // Function to handle logout
        function logout() {
            // Clear the logged-in instructor from session storage
            sessionStorage.removeItem('loggedInInstructor');
            
            // Set logged out flag for preventing back navigation
            sessionStorage.setItem('loggedOut', 'true');
            
            // Redirect to login page
            window.location.href = 'student-login.html';
        }
        
        // Initialize page when DOM content is loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Check if instructor is logged in
            checkLogin();
            
            // Load Font Awesome for icons
            const fontAwesome = document.createElement('link');
            fontAwesome.rel = 'stylesheet';
            fontAwesome.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css';
            document.head.appendChild(fontAwesome);
        });
    </script>
</body>
</html>
